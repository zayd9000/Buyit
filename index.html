<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Car Deal & Profit Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #040814;
            color: #f1f5f9;
            padding: 16px 12px 40px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        /* Hero Header Section */
        .hero-section {
            padding: 10px 0 20px;
        }

        .hero-title {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
            color: #ffffff;
        }

        .hero-title span {
            color: #3b82f6;
            display: block;
        }

        .hero-subtitle {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 6px;
            font-weight: 500;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            color: #e2e8f0;
            margin-top: 12px;
            white-space: nowrap;
        }

        /* Card Panels */
        .card {
            background: #0b1120;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #162035;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .section-header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .num-badge {
            width: 26px;
            height: 26px;
            background: #2563eb;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 800;
        }

        .section-header-title {
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .section-icon {
            font-size: 16px;
            opacity: 0.6;
        }

        /* Inputs & Grids */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-grid-full {
            grid-column: span 2;
        }

        .input-box {
            background: #070c18;
            border: 1px solid #162238;
            border-radius: 12px;
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        .input-icon {
            width: 32px;
            height: 32px;
            background: #0f182e;
            border: 1px solid #1d2b47;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            color: #60a5fa;
        }

        .input-content {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
        }

        .input-content label {
            font-size: 8px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .input-content input, .input-content select {
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            width: 100%;
            outline: none;
            padding: 0;
            margin: 0;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .input-content select {
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .input-content select option {
            background: #0b1120;
            color: #fff;
        }

        /* Live Profit Highlight Box */
        .pricing-layout {
            display: grid;
            grid-template-columns: 2.2fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .pricing-left-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .pricing-subbox {
            background: #070c18;
            border: 1px solid #162238;
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
            min-width: 0;
        }

        .pricing-subbox label {
            font-size: 7.5px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            display: block;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pricing-subbox input {
            background: transparent;
            border: none;
            color: #60a5fa;
            font-size: 11.5px;
            font-weight: 800;
            text-align: center;
            width: 100%;
            outline: none;
        }

        .profit-highlight-card {
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .profit-highlight-card span {
            font-size: 8px;
            font-weight: 800;
            color: #4ade80;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .profit-amount {
            font-size: 15px;
            font-weight: 900;
            color: #4ade80;
            margin: 2px 0;
        }

        .profit-margin-badge {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            font-size: 8px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
        }

        /* Main Save Button */
        .btn-add {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
        }

        .btn-add:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Counters Bar */
        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .summary-card {
            background: #0b1120;
            border: 1px solid #162035;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .summary-card-icon {
            width: 36px;
            height: 36px;
            background: #0f182e;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #2563eb;
        }

        .summary-card-content span {
            font-size: 8.5px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            display: block;
        }

        .summary-card-content strong {
            font-size: 18px;
            font-weight: 900;
            color: #2563eb;
        }

        /* Search Bar */
        .search-container {
            position: relative;
            margin-bottom: 14px;
        }

        .search-bar {
            width: 100%;
            background: #0b1120;
            border: 1px solid #162035;
            border-radius: 12px;
            padding: 12px 12px 12px 40px;
            color: #fff;
            font-size: 12px;
            outline: none;
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 15px;
        }

        /* Vehicle Cards List */
        .cars-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .car-card {
            background: #0b1120;
            border-radius: 14px;
            padding: 14px;
            border: 1px solid #162035;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .car-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .car-title {
            font-size: 15px;
            font-weight: 800;
            color: #ffffff;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 5px;
        }

        .badge {
            font-size: 9.5px;
            font-weight: 700;
            padding: 3px 7px;
            border-radius: 6px;
            background: #070c18;
            color: #94a3b8;
            border: 1px solid #162238;
        }

        .badge-clean { border-color: rgba(34, 197, 94, 0.4); color: #4ade80; }
        .badge-crashed { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

        .price-row {
            display: flex;
            justify-content: space-between;
            background: #070c18;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #162238;
            font-size: 11px;
        }

        .price-badge {
            display: inline-block;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 9.5px;
            font-weight: 800;
        }

        .tag-good { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }
        .tag-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid #ef4444; }

        .action-buttons {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }

        .btn-whatsapp {
            flex: 1;
            background: #25D366;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 9px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
        }

        .save-indicator {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 9px;
            font-weight: 800;
            color: #4ade80;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 3px 8px;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.visible { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <!-- Hero Header (Without Image) -->
    <div class="hero-section">
        <h1 class="hero-title">Car Deal & <span>Profit Tracker</span></h1>
        <p class="hero-subtitle">Track deals, evaluate profits, close smarter.</p>
        <div class="hero-badge">
            🚘 Toyota Land Cruiser 2026 GXR
        </div>
    </div>

    <!-- Main Entry Form -->
    <div class="card">
        <div class="save-indicator" id="saveIndicator">✓ Live Auto-Saved</div>

        <!-- 1. VEHICLE DETAILS -->
        <div class="section-header">
            <div class="section-header-left">
                <div class="num-badge">1</div>
                <div class="section-header-title">Vehicle Details</div>
            </div>
            <div class="section-icon">🚘</div>
        </div>

        <div class="form-grid">
            <div class="input-box">
                <div class="input-icon">🛡️</div>
                <div class="input-content">
                    <label>Brand</label>
                    <input type="text" id="brand" placeholder="Toyota" oninput="autoSaveDraft()">
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon">🚗</div>
                <div class="input-content">
                    <label>Model</label>
                    <input type="text" id="model" placeholder="Land Cruiser" oninput="autoSaveDraft()">
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon">⭐</div>
                <div class="input-content">
                    <label>Trim / Edition</label>
                    <input type="text" id="trim" placeholder="GXR" oninput="autoSaveDraft()">
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon">📅</div>
                <div class="input-content">
                    <label>Year</label>
                    <input type="number" id="year" placeholder="2026" oninput="autoSaveDraft()">
                </div>
            </div>
            <div class="input-box form-grid-full">
                <div class="input-icon">⏲️</div>
                <div class="input-content">
                    <label>KM / Mileage</label>
                    <input type="number" id="km" placeholder="15000" oninput="autoSaveDraft()">
                </div>
            </div>
        </div>

        <!-- 2. VEHICLE CONDITION -->
        <div class="section-header" style="margin-top: 16px;">
            <div class="section-header-left">
                <div class="num-badge">2</div>
                <div class="section-header-title">Vehicle Condition</div>
            </div>
            <div class="section-icon">📋</div>
        </div>

        <div class="form-grid">
            <div class="input-box">
                <div class="input-icon" style="color:#4ade80;">🛡️</div>
                <div class="input-content">
                    <label>Accident History</label>
                    <select id="condition" onchange="autoSaveDraft()">
                        <option value="Clean">Clean (No Crash)</option>
                        <option value="Crashed / Repaired">Crashed / Repaired</option>
                    </select>
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon" style="color:#4ade80;">✓</div>
                <div class="input-content">
                    <label>Warranty Status</label>
                    <select id="warranty" onchange="autoSaveDraft()">
                        <option value="Under Warranty">Under Warranty</option>
                        <option value="No Warranty">No Warranty</option>
                    </select>
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon" style="color:#a855f7;">🌀</div>
                <div class="input-content">
                    <label>Turbo Option</label>
                    <select id="turbo" onchange="autoSaveDraft()">
                        <option value="Turbo">Turbo</option>
                        <option value="Non-Turbo">Non-Turbo</option>
                    </select>
                </div>
            </div>
            <div class="input-box">
                <div class="input-icon" style="color:#eab308;">⛽</div>
                <div class="input-content">
                    <label>Fuel / Engine Type</label>
                    <select id="hybrid" onchange="autoSaveDraft()">
                        <option value="Gasoline">Gasoline</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Diesel">Diesel</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 3. PRICING & EVALUATION -->
        <div class="section-header" style="margin-top: 16px;">
            <div class="section-header-left">
                <div class="num-badge">3</div>
                <div class="section-header-title">Pricing & Evaluation (USD)</div>
            </div>
            <div class="section-icon">📈</div>
        </div>

        <div class="pricing-layout">
            <div class="pricing-left-grid">
                <div class="pricing-subbox">
                    <label>Asking Price</label>
                    <input type="number" id="askingPrice" placeholder="65000" oninput="autoSaveDraft()">
                </div>
                <div class="pricing-subbox">
                    <label style="color:#4ade80;">Market Price</label>
                    <input type="number" id="marketPrice" style="color:#4ade80;" placeholder="72000" oninput="autoSaveDraft()">
                </div>
                <div class="pricing-subbox">
                    <label style="color:#c084fc;">Target Buy</label>
                    <input type="number" id="targetPrice" style="color:#c084fc;" placeholder="66000" oninput="autoSaveDraft()">
                </div>
            </div>

            <!-- Live Profit Calculation Preview -->
            <div class="profit-highlight-card">
                <span>Potential Profit</span>
                <div class="profit-amount" id="liveProfitDisplay">$0</div>
                <div class="profit-margin-badge" id="liveMarginDisplay">0.0% MARGIN</div>
            </div>
        </div>

        <div class="input-box" style="margin-bottom: 14px;">
            <div class="input-icon">📝</div>
            <div class="input-content">
                <label>Notes / Extra Details</label>
                <input type="text" id="notes" placeholder="First owner, full dealer service" oninput="autoSaveDraft()">
            </div>
        </div>

        <button class="btn-add" onclick="addCar()">
            💾 Save Vehicle to Hub
        </button>
    </div>

    <!-- Summary Statistics -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-card-icon">🚘</div>
            <div class="summary-card-content">
                <span>Vehicles Tracked</span>
                <strong id="totalCount">0</strong>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-card-icon" style="color:#4ade80;">🏷️</div>
            <div class="summary-card-content">
                <span>Good Buy Deals</span>
                <strong id="goodDealsCount" style="color: #4ade80;">0</strong>
            </div>
        </div>
    </div>

    <!-- Search Input -->
    <div class="search-container">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchBar" class="search-bar" placeholder="Search by Brand, Model, Trim, Year..." onkeyup="renderCars()">
    </div>

    <!-- Cars Output List -->
    <div id="carsList" class="cars-list"></div>
</div>

<script>
    let cars = JSON.parse(localStorage.getItem('dealershipCarHub')) || [];

    window.onload = function() {
        const draft = JSON.parse(localStorage.getItem('carDraftData')) || {};
        if (draft.brand) document.getElementById('brand').value = draft.brand;
        if (draft.model) document.getElementById('model').value = draft.model;
        if (draft.trim) document.getElementById('trim').value = draft.trim;
        if (draft.year) document.getElementById('year').value = draft.year;
        if (draft.km) document.getElementById('km').value = draft.km;
        if (draft.condition) document.getElementById('condition').value = draft.condition;
        if (draft.warranty) document.getElementById('warranty').value = draft.warranty;
        if (draft.turbo) document.getElementById('turbo').value = draft.turbo;
        if (draft.hybrid) document.getElementById('hybrid').value = draft.hybrid;
        if (draft.asking) document.getElementById('askingPrice').value = draft.asking;
        if (draft.market) document.getElementById('marketPrice').value = draft.market;
        if (draft.target) document.getElementById('targetPrice').value = draft.target;
        if (draft.notes) document.getElementById('notes').value = draft.notes;
        
        updateLiveProfit();
        renderCars();
    };

    function autoSaveDraft() {
        const draft = {
            brand: document.getElementById('brand').value,
            model: document.getElementById('model').value,
            trim: document.getElementById('trim').value,
            year: document.getElementById('year').value,
            km: document.getElementById('km').value,
            condition: document.getElementById('condition').value,
            warranty: document.getElementById('warranty').value,
            turbo: document.getElementById('turbo').value,
            hybrid: document.getElementById('hybrid').value,
            asking: document.getElementById('askingPrice').value,
            market: document.getElementById('marketPrice').value,
            target: document.getElementById('targetPrice').value,
            notes: document.getElementById('notes').value
        };
        localStorage.setItem('carDraftData', JSON.stringify(draft));
        updateLiveProfit();
        showSaveIndicator();
    }

    function updateLiveProfit() {
        const asking = parseFloat(document.getElementById('askingPrice').value) || 0;
        const market = parseFloat(document.getElementById('marketPrice').value) || 0;
        const profit = market > asking ? market - asking : 0;
        const margin = asking > 0 ? ((profit / asking) * 100).toFixed(1) : 0;

        document.getElementById('liveProfitDisplay').innerText = '$' + profit.toLocaleString();
        document.getElementById('liveMarginDisplay').innerText = margin + '% MARGIN';
    }

    function showSaveIndicator() {
        const indicator = document.getElementById('saveIndicator');
        indicator.classList.add('visible');
        setTimeout(() => indicator.classList.remove('visible'), 1000);
    }

    function addCar() {
        const brand = document.getElementById('brand').value.toUpperCase();
        const model = document.getElementById('model').value;
        const trim = document.getElementById('trim').value.toUpperCase();
        const year = document.getElementById('year').value;
        const km = parseFloat(document.getElementById('km').value) || 0;
        const condition = document.getElementById('condition').value;
        const warranty = document.getElementById('warranty').value;
        const turbo = document.getElementById('turbo').value;
        const hybrid = document.getElementById('hybrid').value;
        const asking = parseFloat(document.getElementById('askingPrice').value) || 0;
        const market = parseFloat(document.getElementById('marketPrice').value) || 0;
        const target = parseFloat(document.getElementById('targetPrice').value) || 0;
        const notes = document.getElementById('notes').value;

        if (!brand || !model) {
            alert("Please enter at least the Brand and Model.");
            return;
        }

        const newCar = {
            id: Date.now(),
            fullName: `${brand} ${model} ${year} ${trim}`.trim(),
            brand, model, trim, year, km, condition, warranty, turbo, hybrid,
            asking, market, target, notes
        };

        cars.push(newCar);
        localStorage.setItem('dealershipCarHub', JSON.stringify(cars));
        
        // Reset Inputs & Draft
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('notes').value = '';
        localStorage.removeItem('carDraftData');
        updateLiveProfit();
        renderCars();
    }

    function deleteCar(id) {
        if (confirm("Are you sure you want to delete this car?")) {
            cars = cars.filter(c => c.id !== id);
            localStorage.setItem('dealershipCarHub', JSON.stringify(cars));
            renderCars();
        }
    }

    function sendToWhatsApp(carJson) {
        const car = JSON.parse(decodeURIComponent(carJson));
        
        let dealStatus = "";
        if (car.target > 0) {
            dealStatus = car.asking <= car.target ? "✅ GOOD BUY DEAL" : "❌ ABOVE TARGET";
        }

        const text = 
`🚗 *VEHICLE FOR SALE / DEAL*
*${car.fullName}*

• *Condition:* ${car.condition}
• *Mileage:* ${car.km.toLocaleString()} KM
• *Warranty:* ${car.warranty}
• *Engine:* ${car.turbo} | ${car.hybrid}

💵 *Asking Price:* $${car.asking.toLocaleString()}
📈 *Market Price:* $${car.market.toLocaleString()}
🎯 *Target Buy:* $${car.target.toLocaleString()}
${dealStatus ? `\n*Status:* ${dealStatus}` : ''}
${car.notes ? `\n📝 *Notes:* ${car.notes}` : ''}`;

        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    function renderCars() {
        const listContainer = document.getElementById('carsList');
        const search = document.getElementById('searchBar').value.toLowerCase();
        listContainer.innerHTML = '';

        let totalDeals = 0;
        let goodDeals = 0;

        cars.forEach(car => {
            if (car.fullName.toLowerCase().includes(search) || car.notes.toLowerCase().includes(search)) {
                totalDeals++;

                let evaluationBadge = '';
                if (car.target > 0) {
                    if (car.asking <= car.target) {
                        goodDeals++;
                        const margin = car.market > 0 ? (car.market - car.asking) : 0;
                        evaluationBadge = `<div class="price-badge tag-good">✓ GOOD PRICE TO BUY (${margin > 0 ? '+$' + margin.toLocaleString() + ' Est. Profit' : 'Below Target'})</div>`;
                    } else {
                        const difference = car.asking - car.target;
                        evaluationBadge = `<div class="price-badge tag-high">✕ OVER TARGET (+$${difference.toLocaleString()})</div>`;
                    }
                }

                const condBadge = car.condition === 'Clean' 
                    ? `<span class="badge badge-clean">Clean</span>` 
                    : `<span class="badge badge-crashed">Crashed/Repaired</span>`;

                const carJsonEncoded = encodeURIComponent(JSON.stringify(car));

                const carHTML = `
                    <div class="car-card">
                        <div class="car-header">
                            <div>
                                <div class="car-title">${car.fullName}</div>
                                <div class="tags-container">
                                    ${condBadge}
                                    <span class="badge">${car.km.toLocaleString()} KM</span>
                                    <span class="badge">${car.warranty}</span>
                                    <span class="badge">${car.turbo}</span>
                                    <span class="badge">${car.hybrid}</span>
                                </div>
                            </div>
                        </div>

                        <div class="price-row">
                            <div><strong>Asking:</strong> $${car.asking.toLocaleString()}</div>
                            <div style="color:#4ade80;"><strong>Market:</strong> $${car.market.toLocaleString()}</div>
                            <div style="color:#c084fc;"><strong>Target:</strong> $${car.target.toLocaleString()}</div>
                        </div>

                        ${evaluationBadge}
                        ${car.notes ? `<p style="font-size:10.5px; color:#94a3b8;">📝 Note: ${car.notes}</p>` : ''}

                        <div class="action-buttons">
                            <button class="btn-whatsapp" onclick="sendToWhatsApp('${carJsonEncoded}')">
                                💬 WhatsApp
                            </button>
                            <button class="btn-delete" onclick="deleteCar(${car.id})">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                listContainer.innerHTML += carHTML;
            }
        });

        document.getElementById('totalCount').innerText = totalDeals;
        document.getElementById('goodDealsCount').innerText = goodDeals;
    }
</script>

</body>
</html>
