<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Deal & Profit Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
            color: #38bdf8;
        }

        .card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #334155;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
        }

        input, select, textarea {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: #fff;
            font-size: 13px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }

        .btn-add {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            color: #0f172a;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-add:hover {
            background-color: #7dd3fc;
        }

        .search-bar {
            width: 100%;
            margin-bottom: 15px;
        }

        .summary-bar {
            display: flex;
            justify-content: space-around;
            background-color: #1e293b;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item span {
            display: block;
            font-size: 12px;
            color: #94a3b8;
        }

        .summary-item strong {
            font-size: 18px;
            color: #38bdf8;
        }

        .cars-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .car-card {
            background-color: #1e293b;
            border-radius: 10px;
            padding: 16px;
            border: 1px solid #334155;
            display: grid;
            grid-template-columns: 2fr 1fr auto;
            gap: 15px;
            align-items: center;
        }

        .car-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
        }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .badge-clean { border-color: #22c55e; color: #4ade80; }
        .badge-crashed { border-color: #ef4444; color: #f87171; }

        .price-badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 8px;
        }

        .tag-good {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .tag-high {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .btn-delete {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 18px;
            padding: 5px;
        }

        .save-indicator {
            font-size: 11px;
            color: #4ade80;
            text-align: right;
            margin-top: -10px;
            margin-bottom: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .save-indicator.visible { opacity: 1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Car Deal & Profit Tracker</h1>

    <!-- Form Input Card -->
    <div class="card">
        <div class="save-indicator" id="saveIndicator">✓ Draft saved</div>
        
        <div class="section-title">1. Vehicle Details</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Brand</label>
                <input type="text" id="brand" placeholder="e.g. Toyota" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Model</label>
                <input type="text" id="model" placeholder="e.g. Land Cruiser" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Trim / Edition</label>
                <input type="text" id="trim" placeholder="e.g. GX.R LIMITED" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Year</label>
                <input type="number" id="year" placeholder="2025" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>KM / Mileage</label>
                <input type="number" id="km" placeholder="e.g. 15000" oninput="autoSaveDraft()">
            </div>
        </div>

        <div class="section-title">2. Specs & Condition</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Accident History</label>
                <select id="condition" onchange="autoSaveDraft()">
                    <option value="Clean">Clean (No Crash)</option>
                    <option value="Crashed / Repaired">Crashed / Repaired</option>
                </select>
            </div>
            <div class="input-group">
                <label>Warranty Status</label>
                <select id="warranty" onchange="autoSaveDraft()">
                    <option value="Under Warranty">Under Warranty</option>
                    <option value="No Warranty">No Warranty</option>
                </select>
            </div>
            <div class="input-group">
                <label>Turbo Option</label>
                <select id="turbo" onchange="autoSaveDraft()">
                    <option value="Turbo">Turbo</option>
                    <option value="Non-Turbo">Non-Turbo</option>
                </select>
            </div>
            <div class="input-group">
                <label>Fuel / Engine Type</label>
                <select id="hybrid" onchange="autoSaveDraft()">
                    <option value="Gasoline">Gasoline</option>
                    <option value="Hybrid">Hybrid</option>
                    <option value="Diesel">Diesel</option>
                </select>
            </div>
        </div>

        <div class="section-title">3. Pricing & Evaluation ($ USD)</div>
        <div class="form-grid">
            <div class="input-group">
                <label>Asking / Offering Price ($)</label>
                <input type="number" id="askingPrice" placeholder="e.g. 65000" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Market Price ($)</label>
                <input type="number" id="marketPrice" placeholder="e.g. 72000" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Target Buy Price ($)</label>
                <input type="number" id="targetPrice" placeholder="e.g. 66000" oninput="autoSaveDraft()">
            </div>
            <div class="input-group">
                <label>Notes / Extra Details</label>
                <input type="text" id="notes" placeholder="e.g. First owner, full dealer service" oninput="autoSaveDraft()">
            </div>
        </div>

        <button class="btn-add" onclick="addCar()">Add Vehicle to Hub</button>
    </div>

    <!-- Summary Bar -->
    <div class="summary-bar">
        <div class="summary-item">
            <span>Vehicles Tracked</span>
            <strong id="totalCount">0</strong>
        </div>
        <div class="summary-item">
            <span>Good Buy Deals</span>
            <strong id="goodDealsCount" style="color: #4ade80;">0</strong>
        </div>
    </div>

    <!-- Search -->
    <input type="text" id="searchBar" class="search-bar" placeholder="Search by Brand, Model, Trim, Year..." onkeyup="renderCars()">

    <!-- Car List Container -->
    <div id="carsList" class="cars-list"></div>
</div>

<script>
    let cars = JSON.parse(localStorage.getItem('dealershipCarHub')) || [];

    window.onload = function() {
        const draft = JSON.parse(localStorage.getItem('carDraftData')) || {};
        if (draft.brand) document.getElementById('brand').value = draft.brand;
        if (draft.model) document.getElementById('model').value = draft.model;
        if (draft.trim) document.getElementById('trim').value = draft.trim;
        if (draft.year) document.getElementById('year').value = draft.year;
        if (draft.km) document.getElementById('km').value = draft.km;
        if (draft.condition) document.getElementById('condition').value = draft.condition;
        if (draft.warranty) document.getElementById('warranty').value = draft.warranty;
        if (draft.turbo) document.getElementById('turbo').value = draft.turbo;
        if (draft.hybrid) document.getElementById('hybrid').value = draft.hybrid;
        if (draft.asking) document.getElementById('askingPrice').value = draft.asking;
        if (draft.market) document.getElementById('marketPrice').value = draft.market;
        if (draft.target) document.getElementById('targetPrice').value = draft.target;
        if (draft.notes) document.getElementById('notes').value = draft.notes;
        renderCars();
    };

    function autoSaveDraft() {
        const draft = {
            brand: document.getElementById('brand').value,
            model: document.getElementById('model').value,
            trim: document.getElementById('trim').value,
            year: document.getElementById('year').value,
            km: document.getElementById('km').value,
            condition: document.getElementById('condition').value,
            warranty: document.getElementById('warranty').value,
            turbo: document.getElementById('turbo').value,
            hybrid: document.getElementById('hybrid').value,
            asking: document.getElementById('askingPrice').value,
            market: document.getElementById('marketPrice').value,
            target: document.getElementById('targetPrice').value,
            notes: document.getElementById('notes').value
        };
        localStorage.setItem('carDraftData', JSON.stringify(draft));
        showSaveIndicator();
    }

    function showSaveIndicator() {
        const indicator = document.getElementById('saveIndicator');
        indicator.classList.add('visible');
        setTimeout(() => indicator.classList.remove('visible'), 1000);
    }

    function addCar() {
        const brand = document.getElementById('brand').value.toUpperCase();
        const model = document.getElementById('model').value;
        const trim = document.getElementById('trim').value.toUpperCase();
        const year = document.getElementById('year').value;
        const km = parseFloat(document.getElementById('km').value) || 0;
        const condition = document.getElementById('condition').value;
        const warranty = document.getElementById('warranty').value;
        const turbo = document.getElementById('turbo').value;
        const hybrid = document.getElementById('hybrid').value;
        const asking = parseFloat(document.getElementById('askingPrice').value) || 0;
        const market = parseFloat(document.getElementById('marketPrice').value) || 0;
        const target = parseFloat(document.getElementById('targetPrice').value) || 0;
        const notes = document.getElementById('notes').value;

        if (!brand || !model) {
            alert("Please enter at least the Brand and Model.");
            return;
        }

        const newCar = {
            id: Date.now(),
            fullName: `${brand} ${model} ${year} ${trim}`.trim(),
            brand, model, trim, year, km, condition, warranty, turbo, hybrid,
            asking, market, target, notes
        };

        cars.push(newCar);
        localStorage.setItem('dealershipCarHub', JSON.stringify(cars));
        
        // Reset Inputs & Draft
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('notes').value = '';
        localStorage.removeItem('carDraftData');
        renderCars();
    }

    function deleteCar(id) {
        cars = cars.filter(c => c.id !== id);
        localStorage.setItem('dealershipCarHub', JSON.stringify(cars));
        renderCars();
    }

    function renderCars() {
        const listContainer = document.getElementById('carsList');
        const search = document.getElementById('searchBar').value.toLowerCase();
        listContainer.innerHTML = '';

        let totalDeals = 0;
        let goodDeals = 0;

        cars.forEach(car => {
            if (car.fullName.toLowerCase().includes(search) || car.notes.toLowerCase().includes(search)) {
                totalDeals++;

                let evaluationBadge = '';
                if (car.target > 0) {
                    if (car.asking <= car.target) {
                        goodDeals++;
                        const margin = car.market > 0 ? (car.market - car.asking) : 0;
                        evaluationBadge = `<div class="price-badge tag-good">✓ GOOD PRICE TO BUY (${margin > 0 ? '+$' + margin.toLocaleString() + ' Est. Profit' : 'Below Target'})</div>`;
                    } else {
                        const difference = car.asking - car.target;
                        evaluationBadge = `<div class="price-badge tag-high">✕ OVER TARGET (+$${difference.toLocaleString()})</div>`;
                    }
                }

                const condBadge = car.condition === 'Clean' 
                    ? `<span class="badge badge-clean">Clean</span>` 
                    : `<span class="badge badge-crashed">Crashed/Repaired</span>`;

                const carHTML = `
                    <div class="car-card">
                        <div>
                            <div class="car-title">${car.fullName}</div>
                            <div class="tags-container">
                                ${condBadge}
                                <span class="badge">${car.km.toLocaleString()} KM</span>
                                <span class="badge">${car.warranty}</span>
                                <span class="badge">${car.turbo}</span>
                                <span class="badge">${car.hybrid}</span>
                            </div>
                            ${evaluationBadge}
                            ${car.notes ? `<p style="font-size:11px; color:#94a3b8; margin-top:6px;">Note: ${car.notes}</p>` : ''}
                        </div>
                        <div style="text-align: right; font-size: 13px;">
                            <p><strong>Asking:</strong> $${car.asking.toLocaleString()}</p>
                            <p style="color:#94a3b8;"><strong>Market:</strong> $${car.market.toLocaleString()}</p>
                            <p style="color:#38bdf8;"><strong>Target:</strong> $${car.target.toLocaleString()}</p>
                        </div>
                        <button class="btn-delete" onclick="deleteCar(${car.id})">✕</button>
                    </div>
                `;
                listContainer.innerHTML += carHTML;
            }
        });

        document.getElementById('totalCount').innerText = totalDeals;
        document.getElementById('goodDealsCount').innerText = goodDeals;
    }
</script>

</body>
</html>
